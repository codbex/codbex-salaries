<!--
  Generated by Eclipse Dirigible based on model and template.
  Manage (CRUD) list fragment for SalaryStatus. Rendered into #app on /SalaryStatus.
  Root x-data binds the generated SalaryStatusManageListPage.
-->
<div x-data="SalaryStatusManageListPage" class="vbox size-full gap-4 p-4" @keydown.escape.window="if (selected &amp;&amp; !deleteOpen) closeDetails()">

  <!-- One action row: what you came to do (New) stays visible beside the search and the Filter
       menu, and every discretionary action collapses into the overflow menu. A plain hbox rather
       than x-h-toolbar - the reference list page frames nothing here, the page's own gutter does it.
       The page carries no title of its own either; the shell's breadcrumb names it. -->
  <div class="hbox flex-wrap items-center gap-2">
    <div x-h-input-group class="max-w-sm">
      <input x-h-input.group type="text" :placeholder="T('codbex-salaries:codbex-salaries-model.messages.inputSearch', 'Search SalaryStatus...', { name: T('codbex-salaries:codbex-salaries-model.t.SALARYSTATUS_plural', 'SalaryStatus') })"
             x-model="searchTerm" @input="onSearchChange()" />
      <div x-h-input-group-addon data-align="inline-start">
        <svg x-h-icon data-icon="search" class="size-4" role="img" aria-label="search"></svg>
      </div>
      <div x-h-input-group-addon data-align="inline-end" x-show="searchTerm" x-cloak>
        <button x-h-button.addon data-variant="transparent" data-size="icon-sm" @click="clearSearch()"
                :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.clearSearch', 'Clear search')">
          <svg role="presentation" x-h-lucide data-lucide="x" class="size-4"></svg>
        </button>
      </div>
    </div>

    <!-- The per-column filters live in this menu rather than in a row inside the table: step one
         lists the columns, step two edits the one picked, and Apply writes it into columnFilters and
         runs the single query that implies. The conditions themselves (LIKE on a string, EQ on a
         number, FK or date - see buildConditions) are unchanged. overflow-visible lets the date
         picker's popup overhang the panel, which Harmonia's no-scroll body would otherwise clip. -->
    <div class="relative inline-flex">
      <button x-h-button data-variant="outline" x-h-popover-trigger.chevron="filterOpen" :data-toggled="filterOpen">
        <svg role="presentation" x-h-lucide data-lucide="list-filter"></svg>
        <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.filter', 'Filter')"></span>
        <svg role="presentation" x-h-lucide data-lucide="chevron-down"></svg>
      </button>
      <div x-h-popover.no-scroll data-align="bottom-start" data-innerclicks="true" class="overflow-visible" style="min-width: 18rem">

        <!-- Step one: which column to filter by. A column already filtered shows its value, so the
             same entry is how that filter is changed. -->
        <div class="vbox p-1" x-show="!filterEditing">
          <span x-h-text.muted class="px-2 pt-1 pb-2 text-sm" x-text="T('codbex-salaries:codbex-salaries-model.defaults.addFilter', 'Add filter')"></span>
          <template x-for="col in availableFilters" :key="col.name">
            <button x-h-button data-variant="transparent" class="h-auto justify-start py-2" @click="openFilterEditor(col.name)">
              <span class="vbox min-w-0 flex-1 items-start">
                <span class="truncate" x-text="filterLabel(col)"></span>
                <span class="truncate text-xs text-muted-foreground" x-show="filterHasValue(col, columnFilters[col.name])" x-text="filterValueText(col)"></span>
              </span>
            </button>
          </template>
        </div>

        <!-- Step two: the value. The controls are the ones the table's filter row carried. -->
        <div class="vbox" x-show="filterEditing" x-cloak>
          <div x-h-toolbar data-variant="transparent" data-size="sm">
            <button x-h-button data-variant="transparent" data-size="icon-sm" @click="backToFilterMenu()"
                    :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.back', 'Back')">
              <svg role="presentation" x-h-lucide data-lucide="chevron-left"></svg>
            </button>
            <span x-h-toolbar-title class="truncate" x-text="editedFilterColumn ? filterLabel(editedFilterColumn) : ''"></span>
          </div>
          <div class="p-3">
            <template x-if="editedFilterColumn &amp;&amp; editedFilterColumn.type === 'fk'">
              <select x-model="filterDraft" class="w-full text-sm rounded-md border border-border px-2 py-1">
                <option value="" x-text="T('codbex-salaries:codbex-salaries-model.defaults.all', 'All')"></option>
                <template x-for="opt in optionsForFilter(editedFilterColumn.name)" :key="opt.value">
                  <option :value="opt.value" x-text="opt.text"></option>
                </template>
              </select>
            </template>
            <!-- A boolean column is a Yes/No choice, not a text box: there is nothing sensible to type
                 into it, and the search needs a real true/false for its EQ (issue #7720). -->
            <template x-if="editedFilterColumn &amp;&amp; editedFilterColumn.type === 'boolean'">
              <select x-model="filterDraft" class="w-full text-sm rounded-md border border-border px-2 py-1">
                <option value="" x-text="T('codbex-salaries:codbex-salaries-model.defaults.all', 'All')"></option>
                <option value="true" x-text="T('codbex-salaries:codbex-salaries-model.defaults.yes', 'Yes')"></option>
                <option value="false" x-text="T('codbex-salaries:codbex-salaries-model.defaults.no', 'No')"></option>
              </select>
            </template>
            <!-- A date column filters through the same Harmonia picker the forms use, configured from
                 the instance Date pattern, so the shape it shows and accepts is the one the cells
                 print. A native <input type="date"> renders in the BROWSER's locale instead, which is
                 how one screen could offer dd.mm.yyyy while the form beside it read the same digits as
                 m/d/yyyy. The model stays the ISO the search expects.
                 It takes a range (#8131): From and To, either left empty for an open end, and the
                 quick periods, each of which fills both. -->
            <template x-if="editedFilterColumn &amp;&amp; editedFilterColumn.type === 'date'">
              <div class="vbox gap-3">
                <div class="hbox flex-wrap gap-1">
                  <template x-for="preset in datePresets" :key="preset.key">
                    <button x-h-button data-variant="outline" data-size="sm" @click="applyDatePreset(preset.key)"
                            x-text="T('application-core:shell.list.' + preset.key, preset.label)"></button>
                  </template>
                </div>
                <div class="vbox gap-1">
                  <span class="text-xs text-muted-foreground" x-text="T('application-core:shell.list.dateFrom', 'From')"></span>
                  <div x-h-date-picker>
                    <input type="text" :placeholder="HarmoniaFormat.dateHint()" :aria-label="T('application-core:shell.list.dateFrom', 'From')" />
                    <button x-h-date-picker-trigger :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.chooseDate', 'Choose date')"></button>
                    <div x-h-date-picker-popup="HarmoniaFormat.pickerConfig()" x-model="filterDraft.from"></div>
                  </div>
                </div>
                <div class="vbox gap-1">
                  <span class="text-xs text-muted-foreground" x-text="T('application-core:shell.list.dateTo', 'To')"></span>
                  <div x-h-date-picker>
                    <input type="text" :placeholder="HarmoniaFormat.dateHint()" :aria-label="T('application-core:shell.list.dateTo', 'To')" />
                    <button x-h-date-picker-trigger :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.chooseDate', 'Choose date')"></button>
                    <div x-h-date-picker-popup="HarmoniaFormat.pickerConfig()" x-model="filterDraft.to"></div>
                  </div>
                </div>
              </div>
            </template>
            <template x-if="editedFilterColumn &amp;&amp; editedFilterColumn.type !== 'fk' &amp;&amp; editedFilterColumn.type !== 'date' &amp;&amp; editedFilterColumn.type !== 'boolean'">
              <input x-h-input type="text" class="w-full" x-model="filterDraft" @keydown.enter="applyFilterDraft()"
                     :placeholder="T('codbex-salaries:codbex-salaries-model.defaults.filter', 'Filter')" />
            </template>
          </div>
          <div x-h-toolbar.footer data-size="sm">
            <div x-h-toolbar-spacer></div>
            <button x-h-button data-variant="outline" data-size="sm" @click="closeFilterMenu()"
                    x-text="T('codbex-salaries:codbex-salaries-model.defaults.cancel', 'Cancel')"></button>
            <button x-h-button data-variant="primary" data-size="sm" @click="applyFilterDraft()"
                    x-text="T('codbex-salaries:codbex-salaries-model.defaults.apply', 'Apply')"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- A filter query is in flight: the table keeps the previous rows (see displayState), this
         spinner just signals the refresh so the empty state is never shown mid-query (#7461). -->
    <span x-show="filtering" x-h-spinner aria-hidden="true"></span>
    <div class="flex-1"></div>

    <!-- The Inbox's Refresh (#8130): re-reads the rows under the search, filters, sort and page in
         force, and the stamp says how old the rows on screen are. -->
    <span x-show="lastUpdated" x-h-text.muted x-text="T('application-core:shell.inbox.updated', 'Updated {{time}}', { time: updatedTime() })"></span>
    <button x-h-button data-variant="outline" @click="refresh()">
      <svg role="presentation" x-h-lucide data-lucide="refresh-cw"></svg>
      <span x-text="T('application-core:shell.inbox.refresh', 'Refresh')"></span>
    </button>


    <!-- Write controls show only for a caller the controller's GET /access says may write (#8089) -
         the 403 of each write stays the guard. -->
    <button x-h-button data-variant="primary" x-show="canWrite()" @click="newEntity()">
      <svg role="presentation" x-h-lucide data-lucide="plus"></svg>
      <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.new', 'New')"></span>
    </button>

    <!-- Everything discretionary: the exports and whatever the customActions extension point
         contributes to this page. -->
    <button x-h-button data-variant="outline" data-size="icon" x-h-menu-trigger.dropdown
            :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.moreActions', 'More actions')">
      <svg role="presentation" x-h-lucide data-lucide="ellipsis"></svg>
    </button>
    <ul x-h-menu data-align="bottom-end">
      <!-- Export the filtered rows as CSV / print them (Save as PDF via the browser dialog). -->
      <li x-h-menu-item :aria-disabled="sortedItems.length === 0" @click="exportCsv()">
        <svg role="presentation" x-h-lucide data-lucide="download"></svg>
        <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.export', 'Export')"></span>
      </li>
      <li x-h-menu-item :aria-disabled="sortedItems.length === 0" @click="printList()">
        <svg role="presentation" x-h-lucide data-lucide="printer"></svg>
        <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.print', 'Print')"></span>
      </li>
      <!-- Developer-contributed page actions for this view (customActions extension point). -->
      <template x-for="action in $store.customActions.getActions(caView, 'page')" :key="action.id">
        <li x-h-menu-item @click="$store.customActions.trigger(action)"
            x-text="action.translation &amp;&amp; action.translation.key ? T(action.translation.key, action.label, action.translation.options || {}) : action.label"></li>
      </template>
    </ul>
  </div>

  <!-- The filters in force. A chip names its column and prints its value the way the table prints
       that column; its x drops that one filter and re-queries. -->
  <div class="hbox items-center gap-2 flex-wrap" x-show="hasActiveColumnFilters" x-cloak>
    <span class="text-xs font-medium text-muted-foreground" x-text="T('codbex-salaries:codbex-salaries-model.defaults.activeFilters', 'Active filters')"></span>
    <template x-for="chip in activeFilterChips" :key="chip.name">
      <!-- A chip is the filter it names, so it edits it: its body opens the same editor the Filter
           menu's second step shows. The shape is the documented one - trigger, close, then the
           popover, all inside the chip, which is what x-h-popover resolves against (it walks
           previousElementSibling for the trigger and throws when it finds none, and an uncaught
           directive throw aborts Alpine's walk over everything below it).
           The trigger carries BOTH a bound state and an @click, which is how Harmonia hands over
           full manual control (auto: !(expression && ownClick)) - so this toggles `open` itself and
           restores the outside-click dismissal that goes with the automatic mode. -->
      <!-- relative z-20: x-h-chip carries transform-gpu, which makes it a stacking context, so the
           popover inside it cannot escape however high its own z-index is - and the scrolling table
           below gives its sticky thead z-2, which would then paint over the open panel. Lifting the
           CHIP above that row lifts the popover with it. -->
      <div x-h-chip data-variant="information" class="relative z-20" x-data="{ open: false }" @click.outside="open = false">
        <button x-h-chip-button x-h-popover-trigger="open" @click="open = !open; open &amp;&amp; openFilterEditor(chip.name)">
          <span class="text-muted-foreground" x-text="chip.label + ':'"></span>
          <span class="truncate" style="max-width: 14rem" x-text="chip.text"></span>
        </button>
        <button x-h-chip-close :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.removeFilter', 'Remove {{name}} filter', { name: chip.label })"
                @click="removeFilter(chip.name)"></button>
        <div x-h-popover.no-scroll data-align="bottom-start" data-innerclicks="true" class="overflow-visible" style="min-width: 18rem">
          <div class="p-3">
            <template x-if="editedFilterColumn &amp;&amp; editedFilterColumn.type === 'fk'">
              <select x-model="filterDraft" class="w-full text-sm rounded-md border border-border px-2 py-1">
                <option value="" x-text="T('codbex-salaries:codbex-salaries-model.defaults.all', 'All')"></option>
                <template x-for="opt in optionsForFilter(editedFilterColumn.name)" :key="opt.value">
                  <option :value="opt.value" x-text="opt.text"></option>
                </template>
              </select>
            </template>
            <!-- A boolean column is a Yes/No choice, not a text box: there is nothing sensible to type
                 into it, and the search needs a real true/false for its EQ (issue #7720). -->
            <template x-if="editedFilterColumn &amp;&amp; editedFilterColumn.type === 'boolean'">
              <select x-model="filterDraft" class="w-full text-sm rounded-md border border-border px-2 py-1">
                <option value="" x-text="T('codbex-salaries:codbex-salaries-model.defaults.all', 'All')"></option>
                <option value="true" x-text="T('codbex-salaries:codbex-salaries-model.defaults.yes', 'Yes')"></option>
                <option value="false" x-text="T('codbex-salaries:codbex-salaries-model.defaults.no', 'No')"></option>
              </select>
            </template>
            <!-- A date column filters through the same Harmonia picker the forms use, configured from
                 the instance Date pattern, so the shape it shows and accepts is the one the cells
                 print. A native <input type="date"> renders in the BROWSER's locale instead, which is
                 how one screen could offer dd.mm.yyyy while the form beside it read the same digits as
                 m/d/yyyy. The model stays the ISO the search expects.
                 It takes a range (#8131): From and To, either left empty for an open end, and the
                 quick periods, each of which fills both. -->
            <template x-if="editedFilterColumn &amp;&amp; editedFilterColumn.type === 'date'">
              <div class="vbox gap-3">
                <div class="hbox flex-wrap gap-1">
                  <template x-for="preset in datePresets" :key="preset.key">
                    <button x-h-button data-variant="outline" data-size="sm" @click="applyDatePreset(preset.key)"
                            x-text="T('application-core:shell.list.' + preset.key, preset.label)"></button>
                  </template>
                </div>
                <div class="vbox gap-1">
                  <span class="text-xs text-muted-foreground" x-text="T('application-core:shell.list.dateFrom', 'From')"></span>
                  <div x-h-date-picker>
                    <input type="text" :placeholder="HarmoniaFormat.dateHint()" :aria-label="T('application-core:shell.list.dateFrom', 'From')" />
                    <button x-h-date-picker-trigger :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.chooseDate', 'Choose date')"></button>
                    <div x-h-date-picker-popup="HarmoniaFormat.pickerConfig()" x-model="filterDraft.from"></div>
                  </div>
                </div>
                <div class="vbox gap-1">
                  <span class="text-xs text-muted-foreground" x-text="T('application-core:shell.list.dateTo', 'To')"></span>
                  <div x-h-date-picker>
                    <input type="text" :placeholder="HarmoniaFormat.dateHint()" :aria-label="T('application-core:shell.list.dateTo', 'To')" />
                    <button x-h-date-picker-trigger :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.chooseDate', 'Choose date')"></button>
                    <div x-h-date-picker-popup="HarmoniaFormat.pickerConfig()" x-model="filterDraft.to"></div>
                  </div>
                </div>
              </div>
            </template>
            <template x-if="editedFilterColumn &amp;&amp; editedFilterColumn.type !== 'fk' &amp;&amp; editedFilterColumn.type !== 'date' &amp;&amp; editedFilterColumn.type !== 'boolean'">
              <input x-h-input type="text" class="w-full" x-model="filterDraft" @keydown.enter="open = false; applyFilterDraft()"
                     :placeholder="T('codbex-salaries:codbex-salaries-model.defaults.filter', 'Filter')" />
            </template>
          </div>
          <div x-h-toolbar.footer data-size="sm">
            <button x-h-button data-variant="transparent" data-size="sm" @click="open = false; removeFilter(chip.name)"
                    x-text="T('codbex-salaries:codbex-salaries-model.defaults.remove', 'Remove')"></button>
            <div x-h-toolbar-spacer></div>
            <button x-h-button data-variant="outline" data-size="sm" @click="open = false; backToFilterMenu()"
                    x-text="T('codbex-salaries:codbex-salaries-model.defaults.cancel', 'Cancel')"></button>
            <button x-h-button data-variant="primary" data-size="sm" @click="open = false; applyFilterDraft()"
                    x-text="T('codbex-salaries:codbex-salaries-model.defaults.apply', 'Apply')"></button>
          </div>
        </div>
      </div>
    </template>
    <button x-h-button data-variant="transparent" data-size="sm" @click="clearColumnFilters()"
            x-text="T('codbex-salaries:codbex-salaries-model.defaults.clearFilters', 'Clear filters')"></button>
  </div>

  <!-- Loading -->
  <div x-show="displayState === 'loading'"><div x-h-spinner></div></div>

  <!-- Error -->
  <div x-show="displayState === 'error'" x-h-info-page>
    <div x-h-info-page-header>
      <div x-h-info-page-media.icon><svg x-h-icon data-icon="circle-error" role="img" aria-label="error"></svg></div>
      <div x-h-info-page-title x-text="T('codbex-salaries:codbex-salaries-model.messages.error.loading', 'Could not load')"></div>
      <div x-h-info-page-description x-text="error"></div>
    </div>
    <div x-h-info-page-content>
      <button x-h-button data-variant="primary" @click="load()" x-text="T('codbex-salaries:codbex-salaries-model.defaults.retry', 'Retry')"></button>
    </div>
  </div>

  <!-- Empty -->
  <div x-show="displayState === 'empty'" x-h-info-page>
    <div x-h-info-page-header>
      <div x-h-info-page-media.icon><svg role="presentation" x-h-lucide data-lucide="inbox"></svg></div>
      <div x-h-info-page-title x-text="T('codbex-salaries:codbex-salaries-model.messages.noDataYet', 'No SalaryStatus yet', { name: T('codbex-salaries:codbex-salaries-model.t.SALARYSTATUS_plural', 'SalaryStatus') })"></div>
      <div x-h-info-page-description x-show="canWrite()" x-text="T('codbex-salaries:codbex-salaries-model.messages.getStarted', 'Get started by creating the first record.')"></div>
    </div>
    <div x-h-info-page-content>
      <button x-h-button data-variant="primary" x-show="canWrite()" @click="newEntity()" x-text="T('codbex-salaries:codbex-salaries-model.defaults.formHeadCreate', 'New Salary Status', { name: T('codbex-salaries:codbex-salaries-model.t.SALARYSTATUS', 'Salary Status') })"></button>
    </div>
  </div>

  <!-- Data: master-detail — the table shows only the major columns; selecting a row reveals the
       record's full property list (and its actionable process tasks) in the right-hand pane. -->
  <div x-show="displayState === 'default' || displayState === 'no-results'" class="vbox min-w-0 gap-4">
        <!-- A search or filter that matches nothing: the table's own header would say it in one cell,
             which reads as a broken row rather than an answer. -->
        <div x-show="displayState === 'no-results'" x-h-info-page>
          <div x-h-info-page-header>
            <div x-h-info-page-media.icon><svg role="presentation" x-h-lucide data-lucide="search-x"></svg></div>
            <div x-h-info-page-title x-text="T('codbex-salaries:codbex-salaries-model.messages.noMatch', 'No matching SalaryStatus', { name: T('codbex-salaries:codbex-salaries-model.t.SALARYSTATUS_plural', 'SalaryStatus') })"></div>
            <div x-h-info-page-description x-text="T('codbex-salaries:codbex-salaries-model.messages.noMatchHint', 'Try adjusting your search or filter.')"></div>
          </div>
          <div x-h-info-page-content>
            <button x-h-button data-variant="outline" @click="clearSearch(); clearColumnFilters()"
                    x-text="T('codbex-salaries:codbex-salaries-model.defaults.clearFilters', 'Clear filters')"></button>
          </div>
        </div>

        <div x-show="displayState !== 'no-results'" x-h-table-container data-border="true">
          <table x-h-table x-list-columns data-borders="rows">
            <thead x-h-table-header>
              <tr x-h-table-row>
                <th x-h-table-head scope="col" :aria-sort="ariaSort('Name')">
                  <button class="hbox cursor-pointer items-center gap-1" @click="cycleSort('Name')">
                    <span x-text="T('codbex-salaries:codbex-salaries-model.t.SALARYSTATUS_NAME', 'Name')"></span>
                    <svg x-h-lucide role="presentation" class="size-4"
                         :data-lucide="isSortedAsc('Name') ? 'arrow-up' : (isSortedDesc('Name') ? 'arrow-down' : 'chevrons-up-down')"></svg>
                  </button>
                </th>
                <th x-h-table-head scope="col" class="w-12" data-col-actions><span class="sr-only" x-text="T('codbex-salaries:codbex-salaries-model.aria.tableRowMenu', 'Table Row Menu')"></span></th>
              </tr>
            </thead>
            <tbody x-h-table-body>
              <template x-for="row in paginatedItems" :key="row.Id">
                <tr x-h-table-row data-hoverable="true" :data-state="isSelected(row) ? 'selected' : ''" @click="rowClicked($event, row)" style="cursor:pointer;">
                  <td x-h-table-cell x-text="displayValue(row.Name)"></td>
                  <td x-h-table-cell data-row-actions class="text-right">
                    <button x-h-menu-trigger.dropdown x-h-table-cell-button aria-label="Row actions">
                      <svg role="presentation" x-h-lucide data-lucide="ellipsis"></svg>
                    </button>
                    <ul x-h-menu data-align="bottom-end">
                      <!-- The row's own contributed actions (#8116), first, as in the sheet's menu - the
                           same ones, by the same store call and status guards. -->
                      <template x-for="action in rowActions(row)" :key="action.id">
                        <li x-h-menu-item @click="runRowAction(action, row)"
                            x-text="action.translation &amp;&amp; action.translation.key ? T(action.translation.key, action.label, action.translation.options || {}) : action.label"></li>
                      </template>
                      <li x-h-menu-separator x-show="rowActions(row).length"></li>
                      <li x-h-menu-item @click="previewEntity(row)" x-text="T('codbex-salaries:codbex-salaries-model.defaults.preview', 'Preview')"></li>
                      <li x-h-menu-item x-show="canWrite()" @click="editEntity(row)" x-text="T('codbex-salaries:codbex-salaries-model.defaults.edit', 'Edit')"></li>
                      <li x-h-menu-separator x-show="canWrite()"></li>
                      <li x-h-menu-item x-show="canWrite()" data-variant="negative" @click="askDelete(row)" x-text="T('codbex-salaries:codbex-salaries-model.defaults.delete', 'Delete')"></li>
                    </ul>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="hbox items-center justify-between gap-2" x-show="sortedItems.length > 0">
          <span class="text-sm text-muted-foreground" x-text="showingRange()"></span>
        <nav x-h-pagination class="w-fit!" x-show="totalPages > 1">
          <ul x-h-pagination-content>
            <li x-h-pagination-item>
              <a x-h-pagination-link.previous href="#" :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.previous', 'Previous')" :aria-disabled="currentPage <= 1" :tabindex="currentPage <= 1 ? -1 : 0" @click.prevent="if (currentPage > 1) goPage(currentPage - 1)">
                <svg x-h-lucide role="presentation" data-lucide="chevron-left"></svg>
                <span x-h-pagination-link-label x-text="T('codbex-salaries:codbex-salaries-model.defaults.previous', 'Previous')"></span>
              </a>
            </li>
            <template x-for="(p, i) in pageWindow()" :key="i">
              <li x-h-pagination-item>
                <template x-if="p === '...'"><span x-h-pagination-ellipsis></span></template>
                <template x-if="p !== '...'"><a x-h-pagination-link="currentPage === p" href="#" @click.prevent="goPage(p)" x-text="p"></a></template>
              </li>
            </template>
            <li x-h-pagination-item>
              <a x-h-pagination-link.next href="#" :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.next', 'Next')" :aria-disabled="currentPage >= totalPages" :tabindex="currentPage >= totalPages ? -1 : 0" @click.prevent="if (currentPage < totalPages) goPage(currentPage + 1)">
                <span x-h-pagination-link-label x-text="T('codbex-salaries:codbex-salaries-model.defaults.next', 'Next')"></span>
                <svg x-h-lucide role="presentation" data-lucide="chevron-right"></svg>
              </a>
            </li>
          </ul>
        </nav>
        </div>
  </div>

  <!-- The selected record's full property list + its actionable process tasks, in a sheet over the
       list rather than a panel beside it, so the table keeps the full width it is read in. The
       overlay owns detailsOpen two-way: dismissing it by the scrim goes through the same
       closeDetails() the Close button calls (see the watcher in the page component). -->
  <div x-h-sheet-overlay="detailsOpen">
    <div x-h-sheet data-align="right" style="width: min(38rem, 100vw)">
      <div class="vbox size-full min-h-0">

        <!-- The header does not scroll with the record: one primary action, everything else behind
             the overflow, and the key as a link into the record's own preview page. Which action is
             primary is decided in the component (primaryAction): the record's own process task
             outranks everything, then a contributed action, then Edit - or Preview when the record's
             status makes it read-only and there is nothing to edit. -->
        <div x-h-toolbar data-variant="transparent" class="shrink-0">
          <button x-h-button data-variant="link" class="shrink-0" @click="previewEntity(selected)"
                  :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.preview', 'Preview') + ' #' + selectedId"
                  x-text="'#' + selectedId"></button>
          <div x-h-toolbar-spacer></div>

          <template x-if="primaryAction === 'task'">
            <button x-h-button data-variant="primary" @click="$store.processTasks.openTask(primaryTask)">
              <svg role="presentation" x-h-lucide data-lucide="inbox"></svg>
              <span x-text="$store.processTasks.taskName(primaryTask)"></span>
            </button>
          </template>
          <template x-if="primaryAction === 'action'">
            <button x-h-button data-variant="primary" @click="runPrimaryAction()">
              <span x-text="primaryActionLabel()"></span>
            </button>
          </template>
          <template x-if="primaryAction === 'edit'">
            <button x-h-button data-variant="primary" @click="editEntity(selected)">
              <svg role="presentation" x-h-lucide data-lucide="pencil"></svg>
              <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.edit', 'Edit')"></span>
            </button>
          </template>
          <template x-if="primaryAction === 'preview'">
            <button x-h-button data-variant="primary" @click="previewEntity(selected)">
              <svg role="presentation" x-h-lucide data-lucide="eye"></svg>
              <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.preview', 'Preview')"></span>
            </button>
          </template>

          <button x-h-button data-variant="outline" data-size="icon" x-h-menu-trigger.dropdown
                  :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.moreActions', 'More actions')">
            <svg role="presentation" x-h-lucide data-lucide="ellipsis"></svg>
          </button>
          <!-- Everything the primary did not take, one group per kind: the record's remaining tasks,
               the remaining contributed actions, the other way of opening it, the calendars scoped to
               it - and the delete on its own, in the negative colour. -->
          <ul x-h-menu data-align="bottom-end">
            <template x-for="task in menuTasks" :key="task.id">
              <li x-h-menu-item @click="$store.processTasks.openTask(task)">
                <svg role="presentation" x-h-lucide data-lucide="inbox"></svg>
                <span x-text="$store.processTasks.taskName(task)"></span>
              </li>
            </template>
            <li x-h-menu-separator x-show="menuTasks.length &amp;&amp; menuActions.length"></li>
            <template x-for="action in menuActions" :key="action.id">
              <li x-h-menu-item @click="$store.customActions.trigger(action, selectedId, selected)"
                  x-text="action.translation &amp;&amp; action.translation.key ? T(action.translation.key, action.label, action.translation.options || {}) : action.label"></li>
            </template>
            <li x-h-menu-separator x-show="(menuTasks.length || menuActions.length) &amp;&amp; menuHasRecordActions"></li>
            <li x-h-menu-item x-show="menuHasPreview" @click="previewEntity(selected)">
              <svg role="presentation" x-h-lucide data-lucide="eye"></svg>
              <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.preview', 'Preview')"></span>
            </li>
            <li x-h-menu-item x-show="menuHasEdit" @click="editEntity(selected)">
              <svg role="presentation" x-h-lucide data-lucide="pencil"></svg>
              <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.edit', 'Edit')"></span>
            </li>
            <li x-h-menu-separator x-show="menuHasDelete &amp;&amp; menuHasAnythingAbove"></li>
            <!-- The one destructive action, alone in its group. It is withheld from a record its
                 status makes read-only, which the controller would refuse with a 409 anyway. -->
            <li x-h-menu-item data-variant="negative" x-show="menuHasDelete" @click="askDelete(selected)">
              <svg role="presentation" x-h-lucide data-lucide="trash-2"></svg>
              <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.delete', 'Delete')"></span>
            </li>
          </ul>
        </div>

        <div class="vbox min-h-0 flex-1 gap-4 overflow-auto p-4">
          <!-- What kind of thing this is, over its properties - the key itself is in the header. -->
          <h2 x-h-text.h4 class="truncate" x-text="sheetTitle()"></h2>

        <!-- Every property of the selected record (the table above shows only the major ones),
             unframed: the sheet IS the frame, and a card inside it only draws a second border around
             what the reader is already looking at. Stack the field pairs into a single column until
             the pane is wide enough for two (lg:), and let every cell shrink and wrap its value
             (min-w-0 wrap-anywhere) so an unbreakable value - an email, a phone number - breaks onto
             a new line instead of overflowing its column and colliding with the neighbour (#7462). -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-4 gap-y-4">
          <div class="vbox min-w-0 wrap-anywhere">
            <span x-h-text.muted class="text-xs uppercase" x-text="T('codbex-salaries:codbex-salaries-model.t.SALARYSTATUS_NAME', 'Name')"></span>
            <span x-text="displayValue(selected?.Name, false)"></span>
          </div>
            </div>
        </div>

        <!-- The way back out of the record, where the reference app puts it: one footer control,
             which Esc and the scrim also do (see the detailsOpen watcher). -->
        <div x-h-toolbar.footer class="shrink-0">
          <button x-h-button data-variant="transparent" @click="closeDetails()">
            <svg role="presentation" x-h-lucide data-lucide="arrow-left"></svg>
            <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.backToList', 'Back to list')"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div x-h-dialog-overlay :data-open="deleteOpen">
    <div x-h-dialog>
      <div x-h-dialog-header>
        <h2 x-h-dialog-title x-text="T('codbex-salaries:codbex-salaries-model.defaults.deleteTitle', 'Delete Salary Status', { name: T('codbex-salaries:codbex-salaries-model.t.SALARYSTATUS', 'Salary Status') })"></h2>
        <p x-h-dialog-description></p>
        <button x-h-dialog-close @click="deleteOpen = false" aria-label="Close"><svg role="presentation" x-h-lucide data-lucide="x"></svg></button>
      </div>
      <div x-h-dialog-content>
        <p x-text="T('codbex-salaries:codbex-salaries-model.messages.deleteConfirm', 'Are you sure you want to delete {{name}}? This action cannot be undone.', { name: (T('codbex-salaries:codbex-salaries-model.t.SALARYSTATUS', 'Salary Status') + ' ' + recordLabel(deleteTarget)).trim() })"></p>
        <div x-show="deleteError" x-h-alert data-variant="negative" role="alert" class="mt-2">
          <div x-h-alert-description x-text="deleteError"></div>
        </div>
      </div>
      <div x-h-dialog-footer>
        <button x-h-button data-variant="outline" @click="deleteOpen = false" :disabled="deleteBusy" x-text="T('codbex-salaries:codbex-salaries-model.defaults.cancel', 'Cancel')"></button>
        <button x-h-button data-variant="negative" x-show="canWrite()" @click="confirmDelete()" :disabled="deleteBusy">
          <span x-show="deleteBusy" x-h-spinner></span>
          <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.delete', 'Delete')"></span>
        </button>
      </div>
    </div>
  </div>

</div>
