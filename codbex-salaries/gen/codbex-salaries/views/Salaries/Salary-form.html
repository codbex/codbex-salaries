                      </template>
                      <td x-h-table-cell data-row-actions>
                        <button type="button" x-h-button data-variant="transparent" data-size="sm" @click="openRow(row)" :aria-label="T('codbex-salaries:codbex-salaries-model.defaults.open', 'Open')"><svg role="presentation" x-h-lucide data-lucide="external-link"></svg></button>
                        <!-- The row's record's own actions (#8118), beside Open - only when it has any. -->
                        <template x-if="rowActions(row).length">
                          <span class="inline-flex">
                            <button type="button" x-h-button data-variant="transparent" data-size="sm" x-h-menu-trigger.dropdown aria-label="Row actions"><svg role="presentation" x-h-lucide data-lucide="ellipsis"></svg></button>
                            <ul x-h-menu data-align="bottom-end">
                              <template x-for="action in rowActions(row)" :key="action.id">
                                <li x-h-menu-item @click="runRowAction(action, row)"
                                    x-text="action.translation &amp;&amp; action.translation.key ? T(action.translation.key, action.label, action.translation.options || {}) : action.label"></li>
                              </template>
                            </ul>
                          </span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>
    </div>

    </div>

    <!-- Dialog-only footer (issue #7434): the FK "Add" iframe (?dialog=1) hides the sticky header bar
         above, so a create dialog carries its Cancel + Save here. A full-page form (not a dialog) has
         its actions in the header bar and hides this. Save is type=button @click=save() because it
         lives outside the header <form>. -->
    <div x-h-toolbar.footer x-show="isDialog">
      <div x-h-toolbar-spacer></div>
      <!-- The button says what it will do: leaving a dirty form discards the edit (issue #7359). -->
      <button type="button" x-h-button data-variant="transparent" x-show="!isPreview" @click="cancel()" :disabled="state === 'saving'" x-text="isDirty() ? T('codbex-salaries:codbex-salaries-model.defaults.discard', 'Discard') : T('codbex-salaries:codbex-salaries-model.defaults.cancel', 'Cancel')"></button>
      <!-- Nothing to save on an unchanged record; a create is offerable to a caller who may write. -->
      <button type="button" x-h-button data-variant="primary" x-show="!isPreview &amp;&amp; canWrite()" :disabled="state === 'saving' || (isEdit &amp;&amp; !isDirty())" @click="save()">
        <span x-show="state === 'saving'" x-h-spinner></span>
        <svg x-h-lucide role="presentation" data-lucide="save" x-show="state !== 'saving'"></svg><span x-text="isEdit ? T('codbex-salaries:codbex-salaries-model.defaults.update', 'Save') : T('codbex-salaries:codbex-salaries-model.defaults.create', 'Create')"></span>
      </button>
    </div>
    </div>

    <!-- Right sidebar: read-only / audit fields (audit, ProcessId, uuid, read-only), single column,
         top-to-bottom (edit/preview only). -->
  </div>

  <!-- Delete the record from its own page (issue #7491). The list has carried this since it
       existed; on the record page it used to be one navigation away. -->
  <div x-h-dialog-overlay :data-open="deleteOpen">
    <div x-h-dialog>
      <div x-h-dialog-header>
        <h2 x-h-dialog-title x-text="T('codbex-salaries:codbex-salaries-model.defaults.deleteTitle', 'Delete Salary', { name: T('codbex-salaries:codbex-salaries-model.t.SALARY', 'Salary') })"></h2>
        <button x-h-dialog-close @click="deleteOpen = false" aria-label="Close"><svg role="presentation" x-h-lucide data-lucide="x"></svg></button>
      </div>
      <div x-h-dialog-content>
        <p x-text="T('codbex-salaries:codbex-salaries-model.messages.deleteConfirm', 'Are you sure you want to delete {{name}}? This action cannot be undone.', { name: (T('codbex-salaries:codbex-salaries-model.t.SALARY', 'Salary') + ' ' + recordLabel()).trim() })"></p>
        <div x-show="deleteError" x-h-alert data-variant="negative" role="alert" class="mt-2">
          <div x-h-alert-description x-text="deleteError"></div>
        </div>
      </div>
      <div x-h-dialog-footer>
        <button type="button" x-h-button data-variant="outline" @click="deleteOpen = false" :disabled="deleteBusy" x-text="T('codbex-salaries:codbex-salaries-model.defaults.cancel', 'Cancel')"></button>
        <button type="button" x-h-button data-variant="negative" @click="confirmDelete()" :disabled="deleteBusy">
          <span x-show="deleteBusy" x-h-spinner></span>
          <span x-text="T('codbex-salaries:codbex-salaries-model.defaults.delete', 'Delete')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Unsaved-changes guard (issue #7359): the one dialog every exit from a dirty form goes
       through - Cancel/Discard, Escape, a sidebar entry, the browser Back button, and the actions
       that would otherwise save something behind an unsaved header (a line item, a line delete).
       "Save and continue" is the same first button when the user is staying on the page. -->
  <div x-h-dialog-overlay :data-open="leaveOpen">
    <div x-h-dialog>
      <div x-h-dialog-header>
        <h2 x-h-dialog-title x-text="T('codbex-salaries:codbex-salaries-model.messages.unsavedChanges', 'Unsaved changes')"></h2>
        <button x-h-dialog-close @click="leaveKeepEditing()" aria-label="Close"><svg role="presentation" x-h-lucide data-lucide="x"></svg></button>
      </div>
      <div x-h-dialog-content>
        <p x-text="T('codbex-salaries:codbex-salaries-model.messages.unsavedChangesConfirm', 'This form has changes that have not been saved yet.')"></p>
      </div>
      <div x-h-dialog-footer>
        <button type="button" x-h-button data-variant="outline" @click="leaveKeepEditing()" :disabled="leaveBusy" x-text="T('codbex-salaries:codbex-salaries-model.defaults.keepEditing', 'Keep editing')"></button>
        <button type="button" x-h-button data-variant="negative" @click="leaveDiscard()" :disabled="leaveBusy" x-text="T('codbex-salaries:codbex-salaries-model.defaults.discard', 'Discard')"></button>
        <button type="button" x-h-button data-variant="primary" @click="leaveSave()" :disabled="leaveBusy">
          <span x-show="leaveBusy" x-h-spinner></span>
          <span x-text="leaveIntent === 'continue' ? T('codbex-salaries:codbex-salaries-model.defaults.saveAndContinue', 'Save and continue') : T('codbex-salaries:codbex-salaries-model.defaults.saveAndLeave', 'Save and leave')"></span>
        </button>
      </div>
    </div>
  </div>

</div>
